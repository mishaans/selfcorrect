[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mishaans-selfcorrect"
version = "0.1.0"
description = "把候选项映射到类别上，算出生成答案的自我修正的覆盖率并列出未覆盖的类别"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "mishaans" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://mishaans.github.io"
Repository = "https://github.com/mishaans/selfcorrect"
Issues = "https://github.com/mishaans/selfcorrect/issues"

[project.scripts]
selfcorrect = "selfcorrect:main"

[tool.setuptools]
py-modules = ["selfcorrect"]
